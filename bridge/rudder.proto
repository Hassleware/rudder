// Rudder's local gRPC API, served by bridge.py on 127.0.0.1:7833. Generate a client in any language from this file.
// (The Firefox extension can't serve gRPC itself: it connects to the bridge over a WebSocket on 127.0.0.1:7834.)
syntax = "proto3";

package rudder.v1;

service Rudder {
  // Rudder's filters and statistics, as last reported by the extension.
  rpc GetState(Empty) returns (State);
  // The state now, then again on every change.
  rpc WatchState(Empty) returns (stream State);
  // Replace the filter list, the same as editing it in the popup. Fails with UNAVAILABLE if Firefox isn't connected.
  rpc SetFilters(Filters) returns (State);
  // A filtering layer. Send LayerMessage{hello} first, then answer each JudgeRequest with LayerMessage{verdicts} of the
  // same id: one Verdict per video, in order. A video is hidden if any layer hides it. No answer within 25 s, a wrong
  // count, or closing the stream mid-request hides those videos (strict). Closing the stream removes the layer.
  rpc Layer(stream LayerMessage) returns (stream JudgeRequest);

  // Show a panel in Rudder's popup, under the statistics. The same id replaces it; a panel with no blocks removes it.
  // Panels last until the bridge or Firefox restarts.
  rpc SetPanel(Panel) returns (Empty);
  // Clicks on panels' buttons.
  rpc PanelEvents(Empty) returns (stream PanelEvent);

  // How long every stage takes, in ms (keywords, ocr, fingerprints, judge, layers, video: data to shown, ...).
  rpc GetTimings(TimingsRequest) returns (Timings);
  // Check videos against the current filters and layers without showing, counting or remembering them. For tests.
  rpc Test(TestRequest) returns (TestResults);
}

message Empty {}

message Filters {
  repeated string filters = 1;
}

message Stats {
  int32 checked = 1;
  int32 hidden = 2;
  map<string, int32> hidden_by_filter = 3;
  int32 likes = 4;
  int32 dislikes = 5;
  bool learning = 6;  // the like/dislike model is trained
}

message Hidden {
  string id = 1;
  string title = 2;
  string channel = 3;
  string why = 4;
}

message State {
  bool connected = 1;  // Firefox is connected to the bridge
  bool enabled = 2;
  repeated string filters = 3;
  repeated string layers = 4;  // names of the connected layers
  Stats stats = 5;
  repeated Hidden recent = 6;  // the newest hidden videos
}

message Video {
  string id = 1;  // YouTube video id
  string title = 2;
  string channel = 3;
  bytes image = 4;  // the thumbnail Firefox already downloaded; empty if none
  string image_type = 5;  // "image/jpeg" or "image/webp"
}

message JudgeRequest {
  int64 id = 1;
  repeated Video videos = 2;
}

message Verdict {
  bool blocked = 1;
  string why = 2;  // shown in the popup's recently hidden list
}

message Verdicts {
  int64 id = 1;
  repeated Verdict results = 2;
}

message LayerHello {
  string name = 1;  // unique per layer; a new name has every video judged again
}

message LayerMessage {
  oneof msg {
    LayerHello hello = 1;
    Verdicts verdicts = 2;
  }
}

// ---- panels: Rudder's mini UI framework (extension/panel.js renders each block kind) ----

message Panel {
  string id = 1;
  string title = 2;
  repeated Block blocks = 3;
}

message Block {
  oneof kind {
    string text = 1;  // a line of text
    StatGrid stats = 2;  // big numbers, three to a row
    BarList bars = 3;  // labelled bars, scaled to the largest
    Table table = 4;
    string button = 5;  // a button; its clicks arrive on PanelEvents with this label
  }
}

message Stat {
  string label = 1;
  string value = 2;
}

message StatGrid {
  repeated Stat stats = 1;
}

message Bar {
  string label = 1;
  double value = 2;
}

message BarList {
  repeated Bar bars = 1;
}

message Row {
  repeated string cells = 1;
}

message Table {
  repeated string columns = 1;
  repeated Row rows = 2;
}

message PanelEvent {
  string panel = 1;  // the panel's id
  string button = 2;  // the button's label
}

// ---- timings and tests ----

message TimingsRequest {
  bool reset = 1;  // start counting again after this read
}

message Timing {
  string name = 1;
  int64 count = 2;  // runs since the last reset
  double mean_ms = 3;
  double p50_ms = 4;  // percentiles over the newest 500 runs
  double p95_ms = 5;
  double max_ms = 6;
  double last_ms = 7;
}

message Timings {
  repeated Timing timings = 1;
}

message TestRequest {
  repeated Video videos = 1;  // id is optional; a real video id also applies your own likes and dislikes of it
}

message FilterVerdict {
  bool blocked = 1;
  string verdict = 2;  // e.g. "keyword: minecraft", "thumbnail text: casino", or a layer's why
}

message TestResult {
  string id = 1;
  bool hidden = 2;
  string why = 3;
  map<string, FilterVerdict> filters = 4;  // per filter (and "app: ..." for layers); filters with no verdict are absent
}

message TestResults {
  repeated TestResult results = 1;
  double ms = 2;  // the whole check, including the round trip to Firefox
}
