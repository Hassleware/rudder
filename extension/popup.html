<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rudder</title>
<style>
  :root { --paper: #f2ede1; --ink: #111; --faint: #d9d2c1; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; color: var(--ink); }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { margin: 0; background: var(--paper); }
  body { width: 380px; }
  main { padding: 14px; border: 2px solid var(--ink); }
  .wordmark { display: block; width: 100%; height: auto; color: var(--ink); margin-bottom: 14px; }
  h2 { font: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); border: 2px solid var(--ink); }
  .cell { padding: 8px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  .cell:nth-child(3n) { border-right: 0; }
  .cell:nth-last-child(-n+3) { border-bottom: 0; }
  .num { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .lbl { text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
  ul { list-style: none; margin: 0; padding: 0; border: 2px solid var(--ink); }
  li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 5px 8px; border-bottom: 1px solid var(--ink); position: relative; }
  li:last-child { border-bottom: 0; }
  li > :not(.bar) { position: relative; } /* above the bar */
  li .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .bar { position: absolute; inset: 0 auto 0 0; background: var(--faint); }
  li .n { font-weight: 700; }
  #recent li, #channels li { grid-template-columns: 1fr; gap: 0; }
  #recent .why { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 5px 8px; }
  button, input { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); }
  button { cursor: pointer; padding: 0 6px; line-height: 18px; font-weight: 700; }
  button:hover, button:focus-visible { background: var(--ink); color: var(--paper); outline: 0; }
  #switch { display: grid; grid-template-columns: 1fr auto auto; align-items: center; border: 2px solid var(--ink); margin-bottom: 14px; }
  #switch .lbl { padding: 0 8px; font-weight: 700; }
  #switch button { border-width: 0 0 0 2px; padding: 4px 12px; }
  #switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  body.off #numbers, body.off #panels, body.off #stages { opacity: .35; }
  li.waiting .name::after { content: " · " attr(data-app) " not running"; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
  li.waiting.hides { background: repeating-linear-gradient(-45deg, transparent 0 6px, var(--faint) 6px 8px); }
  #add { display: flex; margin-top: 6px; }
  #add input { flex: 1; min-width: 0; padding: 4px 6px; border-right: 0; }
  #add input:focus { outline: 0; background: #fff; }
  #add button { padding: 0 10px; }
  /* apps' panels (panel.js) */
  .ptext { margin: 0 0 6px; overflow-wrap: anywhere; }
  .panel > * + * { margin-top: 6px; }
  .ptable { width: 100%; border-collapse: collapse; border: 2px solid var(--ink); }
  .ptable th, .ptable td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--ink); overflow-wrap: anywhere; }
  .ptable th { text-transform: uppercase; letter-spacing: .06em; font-size: 10px; border-bottom-width: 2px; }
  .pbutton { padding: 2px 8px; margin-right: 6px; }
</style>
</head>
<body>
<main>

  <div id="switch" role="group" aria-label="Rudder's filtering"><span class="lbl" id="switch-label">FILTERING</span><button id="on" aria-pressed="true">ON</button><button id="off" aria-pressed="false">OFF</button></div>

  <div class="grid" id="numbers">
    <div class="cell"><div class="num" id="checked">0</div><div class="lbl">checked</div></div>
    <div class="cell"><div class="num" id="hidden">0</div><div class="lbl">hidden</div></div>
    <div class="cell"><div class="num" id="rate">0%</div><div class="lbl">hidden rate</div></div>
    <div class="cell"><div class="num" id="likes">0</div><div class="lbl">liked</div></div>
    <div class="cell"><div class="num" id="dislikes">0</div><div class="lbl">disliked</div></div>
    <div class="cell"><div class="num" id="model">0</div><div class="lbl">channels hidden</div></div>
  </div>

  <div id="panels"></div>

  <h2>Pipeline</h2>
  <ul id="stages"></ul>

  <h2>Filters</h2>
  <ul id="list"></ul>
  <form id="add"><input type="text" id="new" maxlength="200" aria-label="New filter" autocomplete="off"><button aria-label="Add filter">+</button></form>

  <h2>Channels hidden</h2>
  <ul id="channels"></ul>

  <h2>Recently hidden</h2>
  <ul id="recent"></ul>

</main>
  <script src="panel.js"></script>
  <script src="popup.js"></script>
</body>
</html>
