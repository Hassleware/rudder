<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Import Gemma model</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  #status { margin-top: 12px; }
</style>
</head>
<body>
  <h2>Import model file</h2>
  <p>Pick <code>gemma-4-e2b-webllm.bin</code> (made by the Download button in <code>index.html</code>).
     This copies it into the extension, so it never has to download the model.</p>
  <input type="file" id="file" accept=".bin">
  <p id="status"></p>
  <script src="import.js"></script>
</body>
</html>
